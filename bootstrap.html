<!DOCTYPE html><html><body><script>
fetch('/portfolio-data.json').then(r => r.text()).then(json => {
  localStorage.setItem('portfolio-command-centre-data', json);
  localStorage.setItem('portfolio-command-centre-meta', JSON.stringify({savedAt:new Date().toISOString(),projectCount:JSON.parse(json).projects.length}));
  location.href = '/index.html';
});
</script></body></html>
